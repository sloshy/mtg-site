name: Build and Deploy Ritual Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Ritual version
        id: ritual-version
        run: |
          VERSION="$RITUAL_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(jq -r '.managed.version // empty' ritual.config.json)
          fi
          if [ -z "$VERSION" ]; then
            # No pin: the latest stable release, else (while only prereleases
            # exist) the newest release — the API omits drafts, newest first.
            VERSION=$(curl -s https://api.github.com/repos/sloshy/ritual/releases/latest \
              | grep '"tag_name"' | head -1 | cut -d'"' -f4)
            if [ -z "$VERSION" ]; then
              VERSION=$(curl -s "https://api.github.com/repos/sloshy/ritual/releases?per_page=1" \
                | grep '"tag_name"' | head -1 | cut -d'"' -f4)
            fi
            if [ -n "$VERSION" ]; then
              echo "::warning::This workspace has no pinned Ritual release (managed.version in ritual.config.json), so $VERSION (the newest release) is used. Run 'ritual migrate' with a Ritual release build and commit ritual.config.json to pin one."
            fi
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a Ritual release to download. Pin one with 'ritual migrate' or set the RITUAL_VERSION repository variable."
            exit 1
          fi
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          RITUAL_VERSION: ${{ vars.RITUAL_VERSION }}

      - name: Cache Ritual binary
        id: ritual-cache
        uses: actions/cache@v6
        with:
          path: ritual
          key: ritual-binary-${{ steps.ritual-version.outputs.version }}-ritual-linux-x86_64

      - name: Download Ritual
        if: steps.ritual-cache.outputs.cache-hit != 'true'
        run: |
          VERSION="${{ steps.ritual-version.outputs.version }}"
          ASSET="ritual-linux-x86_64"
          curl -fsSL -o "$ASSET" "https://github.com/sloshy/ritual/releases/download/${VERSION}/$ASSET"
          curl -fsSL -o "$ASSET.sha256" "https://github.com/sloshy/ritual/releases/download/${VERSION}/$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          mv "$ASSET" ritual
          rm "$ASSET.sha256"
          chmod +x ritual

      - name: Detect and commit changes
        id: detect-changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          # A per-file problem (e.g. a list file missing from the tree) exits
          # nonzero after the other files' changelogs are already written, so
          # capture the status and still commit — then fail the step at the end.
          DETECT_STATUS=0
          ./ritual detect-changes "$BEFORE" || DETECT_STATUS=$?
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            SHORT_SHA=$(git rev-parse --short HEAD)
            git add -A
            git commit -m "Generated changes from commit $SHORT_SHA"
            git push
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi
          exit $DETECT_STATUS

      - name: Generate card manifest
        if: steps.detect-changes.outputs.has-changes != 'true'
        run: ./ritual list-all-cards --out all-cards.md

      - name: Restore Scryfall cache
        if: steps.detect-changes.outputs.has-changes != 'true'
        uses: actions/cache@v6
        with:
          path: cache/
          key: ritual-cache-${{ hashFiles('all-cards.md') }}
          restore-keys: ritual-cache-

      - name: Build site
        if: steps.detect-changes.outputs.has-changes != 'true'
        run: ./ritual build-site --refresh auto

      - name: Setup Pages
        if: steps.detect-changes.outputs.has-changes != 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.detect-changes.outputs.has-changes != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.detect-changes.outputs.has-changes != 'true'
        id: deployment
        uses: actions/deploy-pages@v5
